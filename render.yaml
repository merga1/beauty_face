# Render Blueprint: unified web service serving both the API and the built React storefront.
# Render automatically detects this file when connected to GitHub repository.
# Live URL: https://beauty-face.onrender.com

services:
  - type: web
    name: beauty-face
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    # Migrations run on start (idempotent, checks schema_migrations table)
    startCommand: npm run migrate && npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22.12.0
      - key: NODE_ENV
        value: production

      # Supabase Connection Pooler (Transaction mode, port 6543)
      # Value: postgresql://postgres.jmxuxtqmovbidltohsdp:14383814Bm.@aws-0-eu-west-1.pooler.supabase.com:6543/postgres
      - key: DATABASE_URL
        sync: false

      - key: WEB_ORIGIN
        value: https://beauty-face.onrender.com

      - key: PII_ENCRYPTION_KEY
        sync: false

      - key: CHAPA_PRIVATE_KEY
        sync: false
      - key: CHAPA_WEBHOOK_SECRET
        sync: false
      - key: CHAPA_API_BASE
        value: https://api.chapa.global/v2

      - key: DELIVERY_CITIES
        value: 'Addis Ababa,Adama'
      - key: DELIVERY_FEES_CENTS
        value: 'Addis Ababa:50000,Adama:70000'

      # Supabase Auth client configuration for Vite build
      - key: VITE_SUPABASE_URL
        value: https://jmxuxtqmovbidltohsdp.supabase.co
      - key: VITE_SUPABASE_ANON_KEY
